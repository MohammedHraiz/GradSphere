spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/grad_project}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true

  mail:
    host: smtp.gmail.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

security:
  jwt:
    secret: ${JWT_SECRET:ZW5jb2RlZC1kZWZhdWx0LXNlY3JldC1mb3ItZ3JhZC1wcm9qZWN0LWJhc2U2NC0zMi1ieXRlcw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    university-logo-url: ${UNIVERSITY_LOGO_URL:}
    university-logo-path: ${UNIVERSITY_LOGO_PATH:C:/Users/ADMIN/OneDrive - Balqa Applied University/Desktop/bau_logo.png}
  storage:
    proposals-dir: ${PROPOSALS_DIR:./uploads/proposals}

server:
  port: 8080
