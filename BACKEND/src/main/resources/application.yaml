spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/grad_project}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

security:
  jwt:
    secret: ${JWT_SECRET:ZW5jb2RlZC1kZWZhdWx0LXNlY3JldC1mb3ItZ3JhZC1wcm9qZWN0LWJhc2U2NC0zMi1ieXRlcw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  storage:
    proposals-dir: ${PROPOSALS_DIR:./uploads/proposals}

server:
  port: 8080

logging:
  level:
    org.flywaydb: DEBUG
